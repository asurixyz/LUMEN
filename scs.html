<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>South China Sea - Data Visualization</title>
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#000000; --text-primary:#eaeaec; --text-secondary:#a1a1aa; --accent:#4ea3ff; --border:#2a2a2e; --shadow-light:0 2px 8px rgba(0,0,0,0.35); --blur-bg:rgba(10,10,12,0.6); }
    body { font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter","Segoe UI",Roboto,Oxygen,Ubuntu,Cantarell,"Helvetica Neue",Arial,sans-serif; background-color:var(--bg); color:var(--text-primary); margin:0; padding:0; text-rendering:optimizeLegibility; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; }
    header.nav-blur { padding:1rem 1.5rem; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; background:var(--blur-bg); backdrop-filter:blur(12px) saturate(120%); -webkit-backdrop-filter:blur(12px) saturate(120%); position:sticky; top:0; z-index:10; }
    header h1 { font-size:1.5rem; font-weight:600; margin:0; background:linear-gradient(90deg,#eaeaec,#a1a1aa); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    a { color:var(--accent); text-decoration:none; }
    a:hover { color:#86c8ff; }
    .home-link { position:relative; }
    .home-link::after { content:""; position:absolute; left:0; bottom:-2px; width:0%; height:2px; background:linear-gradient(90deg,#4ea3ff,#86c8ff); transition:width 200ms ease; }
    .home-link:hover::after { width:100%; }
    main { max-width:960px; margin:2rem auto; padding:0 1.5rem; }
    .controls { margin-bottom:1.5rem; display:flex; align-items:center; gap:0.75rem; }
    .controls label { font-size:1.05rem; font-weight:600; color:var(--text-primary); }
    #chart-selector { font-family:inherit; font-size:1rem; padding:0.5rem 0.8rem; border:1px solid var(--border); border-radius:6px; background-color:#0d0d10; color:var(--text-primary); }
    #chart { width:100%; height:65vh; min-height:400px; }
    .chart-desc { margin-top:0.75rem; color:var(--text-secondary); font-size:0.95rem; font-style:italic; }
    footer { text-align:center; padding:2rem; margin-top:3rem; font-size:0.9rem; color:var(--text-secondary); border-top:1px solid var(--border); }
    footer a { color:var(--accent); }
    footer a:hover { color:#86c8ff; }
    @media (max-width:600px) { header h1{font-size:1.2rem;} main{margin:1.5rem auto; padding:0 1rem;} .controls{flex-direction:column; align-items:flex-start;} }
  </style>
</head>
<body>
  <header class="nav-blur">
    <h1>South China Sea: Regional Analysis</h1>
    <a href="home.html" class="home-link">← Return to Dashboard Index</a>
  </header>

  <main>
    <div class="controls">
      <label for="chart-selector">Select Dataset:</label>
      <select id="chart-selector">
        <option value="tradeVolume" data-file="South China Sea/Trade Volume.csv">Trade Volume</option>
        <option value="keyPlayersTrade" data-file="South China Sea/Key Players Trade with SCS Countries.csv">Key Players Trade</option>
        <option value="chinaInvestment" data-file="South China Sea/Chinese Investment.csv">Chinese Investment</option>
        <option value="usInvestment" data-file="South China Sea/US Investment.csv">US Investment</option>
        <option value="totalInvestment" data-file="South China Sea/Total Investment.csv">Total Investment (China vs. US)</option>
        <option value="energyConsumption" data-file="South China Sea/Consumption of Energy.csv">Energy Transit Dependence</option>
      </select>
    </div>
    <div id="chart"></div>
    <div id="chart-desc" class="chart-desc"></div>
  </main>

  <footer>
    © Venkatakrishnan Asuri ·
    <a href="https://github.com/asurixyz" target="_blank" rel="noopener">GitHub</a> ·
    <a href="https://www.linkedin.com/in/asurixyz" target="_blank" rel="noopener">LinkedIn</a>
  </footer>

  <script>
    const PLOTLY_LAYOUT_DEFAULTS = {
        font: { family: 'Georgia, serif' },
        legend: { orientation: 'h', y: -0.2 },
        margin: { t: 50, b: 100 },
        paper_bgcolor: '#fdfdfd',
        plot_bgcolor: '#fdfdfd'
    };
    
    const parseCSV = (file) => {
      return new Promise((resolve, reject) => {
        Papa.parse(encodeURI(file), {
          download: true,
          header: true,
          dynamicTyping: true,
          skipEmptyLines: true,
          complete: results => resolve(results.data),
          error: err => reject(err)
        });
      });
    };

    const numberize = (v) => {
        if (v == null) return null;
        if (typeof v === 'number') return Number.isFinite(v) ? v : null;
        if (typeof v === 'string') {
            const t = String(v).replace(/[,$%]/g, '').trim();
            const n = Number(t);
            return Number.isFinite(n) ? n : null;
        }
        return null;
    };

    // Specific function for the "long" format of the Trade Volume data
    const plotTradeVolume = (data) => {
        const countries = [...new Set(data.map(d => d.Country))].filter(Boolean);
        const years = [...new Set(data.map(d => d.Year))].sort((a, b) => a - b);
        
        const traces = countries.map(country => {
            const countryData = data.filter(d => d.Country === country);
            return {
                x: years,
                y: years.map(year => {
                    const entry = countryData.find(d => d.Year === year);
                    return entry ? numberize(entry["Trade Volume (Imports+Exports) in SCS ($B)"]) : null;
                }),
                mode: 'lines+markers',
                name: country
            };
        });

        const layout = { ...PLOTLY_LAYOUT_DEFAULTS, title: 'Trade Volume in South China Sea', yaxis: { title: 'Trade Volume (Billion USD)' }, xaxis: { title: 'Year' } };
        Plotly.newPlot('chart', traces, layout, { responsive: true });
        document.getElementById('chart-desc').textContent = 'Annual trade volume (imports + exports) through the South China Sea by country.';
    };

    // Generic function for "wide" data formats
    const plotGeneric = (data, title, y_axis_title, desc) => {
        const yearKey = 'Year' in data[0] ? 'Year' : Object.keys(data[0])[0];
        const keys = Object.keys(data[0]).filter(k => k.toLowerCase() !== yearKey.toLowerCase());
        const traces = keys.map(key => ({
            x: data.map(d => d[yearKey]),
            y: data.map(d => numberize(d[key])),
            mode: 'lines+markers',
            name: key
        }));
        const layout = { ...PLOTLY_LAYOUT_DEFAULTS, title, yaxis: { title: y_axis_title }, xaxis: { title: 'Year' } };
        Plotly.newPlot('chart', traces, layout, { responsive: true });
        document.getElementById('chart-desc').textContent = desc;
    };
    
    async function loadAndPlot(selectedOption) {
      const chartType = selectedOption.value;
      const file = selectedOption.dataset.file;
      const chartDiv = document.getElementById('chart');
      const descDiv = document.getElementById('chart-desc');
      
      chartDiv.innerHTML = '';
      descDiv.textContent = 'Loading...';

      try {
        const data = await parseCSV(file);
        if (!data || data.length === 0) {
            descDiv.textContent = "No data found or file could not be loaded.";
            return;
        }

        switch(chartType) {
          case 'tradeVolume':
            plotTradeVolume(data); // Use the dedicated function
            break;
          case 'chinaInvestment':
            plotGeneric(data, 'Chinese Investment in the South China Sea', 'Investment (Billion USD)', 'Breakdown of China\'s annual investment in the South China Sea by sector.');
            break;
          case 'usInvestment':
            plotGeneric(data, 'US Investment in the South China Sea', 'Investment (Billion USD)', 'US financial flows to the region: FDI, security, and development assistance.');
            break;
          case 'totalInvestment':
            plotGeneric(data, 'Total Investment in the South China Sea (China vs. US)', 'Total Investment (Billion USD)', 'Total annual investment comparison between China and the US in the SCS.');
            break;
          case 'energyConsumption':
            plotGeneric(data, 'Energy Transit Dependence on the South China Sea', 'Share of National Energy Consumption (%)', 'Share of each economy\'s energy consumption that transits the South China Sea.');
            break;
          case 'keyPlayersTrade':
            plotGeneric(data, 'Key Players\' Trade with SCS Countries', 'Trade Volume (Billion USD)', 'Trade volumes of major economies with South China Sea countries.');
            break;
          default:
            descDiv.textContent = "Chart type not recognized.";
        }
      } catch (err) {
        descDiv.textContent = `Error loading data from ${file}.`;
        console.error('Error loading:', file, err);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      const selector = document.getElementById('chart-selector');
      selector.addEventListener('change', () => {
        loadAndPlot(selector.options[selector.selectedIndex]);
      });
      // Initial load
      loadAndPlot(selector.options[selector.selectedIndex]);
    });
  </script>
</body>
</html>
